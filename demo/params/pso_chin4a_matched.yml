# PSO (PrScO3), Chin 4A fourth-order splitting at HALF the slices of the
# 21-slice Lie-Trotter benchmark: 11 slices x 19.1 A, dz-matched
# regularisation (z-blur std in A, oalr/oplr and sparse weight scaled with
# dz). Result (markdowns/high_order_splittings.md): loss_single@100 0.2647
# vs benchmark 0.2638 (= run-to-run noise), z-sum phase corr 0.964, and 8x
# more fine-band (0.3-0.6 Nyquist) power than lt11 — the Pr-O dumbbells
# resolve. Cost: two FFT pairs/slice = Lie-Trotter at 2x slices.
#
# The fourth-order schemes REQUIRE propagator_kernel: fresnel (with angular
# spectrum the double commutator is nonlocal and the order is lost).
# splitting_gradient_term: false (g0) is the production choice — the g-term
# is measured neutral on real data at +65% runtime.
#
# Wide-angle alternative (Hamiltonian correction, not a splitting): the
# Lin-Duda cross term via solver_type: 'linduda' with linduda_order: 1 —
# see markdowns/lin_duda.md for the win regime (thick + heavy + low-kV +
# wide collection; PSO is marginal but testable). Splitting order and the
# cross term fix DIFFERENT errors: chin_4a/4b converge the factorization,
# linduda upgrades the generator.
#
# Run from demo/: PTYRAD_DISABLE_ISS_PRECOND=1 CUDA_VISIBLE_DEVICES=<UUID> \
#   ../.venv/bin/python -m ptyrad run --params_path params/pso_chin4a_matched.yml
