[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptyrad"
dynamic = ["version"]
authors = [
  { name="Chia-Hao Lee", email="cl2696@cornell.edu" },
  { name="Bryce Shirley", email="bryce.shirley@stfc.ac.uk"}
]
description = "PtyRAD: Ptychographic Reconstruction with Automatic Differentiation"
readme = "README.md"
keywords = ["Ptychography"]
license = "LGPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
  "accelerate",
  "h5py",
  "jupyter",
  "matplotlib",
  "optuna",
  "pydantic",
  "pre-commit",
  "pytest>=9.0.2",
  "ruff>=0.15.6",
  "scikit-learn",
  "scipy",
  "tifffile",
  "torch>=2.0",
  "torchvision",
  "ty>=0.0.23",
  "pytest-cov>=7.0.0",
  "tqdm>=4.67.3",
]

[project.optional-dependencies]
# synthetic 4D-STEM dataset generation (src/generate_data, `generate-data` CLI)
datagen = [
  "abtem>=1.0.10",
  "cupy-cuda12x[ctk]>=14.2.0",
]

[project.scripts]
ptyrad = "ptyrad.cli:main"
generate-data = "generate_data.cli:main"

[project.urls]
"Homepage" = "https://github.com/chiahao3/ptyrad"
"Repository" = "https://github.com/chiahao3/ptyrad"
"Issues" = "https://github.com/chiahao3/ptyrad/issues"
"Changelog" = "https://github.com/chiahao3/ptyrad/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ptyrad.__version__"}

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201", # print statements (allowed in CLI tool)
    "E741",  # ambiguous variable name: O is the object transmission function throughout the physics code
]

[tool.ruff.lint.per-file-ignores]
# tests and analysis/benchmark scripts set env vars and disable dynamo
# before importing torch, so module imports cannot all sit at the top
"test/**" = ["E402"]
"scripts/**" = ["E402"]
"analysis/**" = ["E402"]
"born_coeff_test*.py" = ["E402"]
"born_vs_recon*.py" = ["E402"]

[tool.ty.src]
include = ["src"]

# generate_data leans on untyped optional deps (abtem, cupy, ase)
[[tool.ty.overrides]]
include = ["src/generate_data/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# Legacy untyped modules: attribute access through torch nn.Module's
# __getattr__ (registered buffers/params come back as Tensor | Module) and
# Optional-heavy initialization code produce stub-driven noise these rules
# cannot see through. New code (e.g. forward_models/) gets full strictness.
[[tool.ty.overrides]]
include = [
    "src/ptyrad/initialization.py",
    "src/ptyrad/models.py",
    "src/ptyrad/reconstruction.py",
    "src/ptyrad/visualization.py",
    "src/ptyrad/utils/image_proc.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-method-override = "ignore"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
